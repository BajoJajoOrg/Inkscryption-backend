version: "3.8"
services:
  db:
    image: postgres:12-alpine
    restart: on-failure
    volumes:
      - ./pkg/db/migrations/:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_DB: BajoJajo
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BajoJajo"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"

  app:
    container_name: canvas
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    build:
      context: .
      dockerfile: canvas.Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENV_PATH: "/app/.env"
      CONFIG_PATH: "/app/config/local.yaml"

  auth:
    container_name: auth
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    build:
      context: .
      dockerfile: auth.Dockerfile
    ports:
      - "8082:8082"
    environment:
      ENV_PATH: "/app/.env"
      CONFIG_PATH: "/app/config/local.yaml"

  adminer:
    image: adminer
    ports:
      - 8000:8080
    depends_on:
      - db

volumes: # часть настроек для хранения данных
  postgresdb-data:
    driver: local
